name: Agentic Review

# Runs the repo's own `review` -> `review-audit` loop against a pull request.
#
# Two entry points:
#   * pull_request  — a review when a PR is opened, reopened or marked ready.
#     `synchronize` (every push) IS listed, but only so a run exists to CLEAR the labels;
#     it never starts a review, or an active PR would re-run the whole loop per commit.
#     Re-review on demand with `/agentic-review`.
#   * issue_comment — a human types `/agentic-review` in the PR's Conversation tab.
#     NOTE: issue_comment only fires from the workflow file on the DEFAULT branch, and its
#     GITHUB_SHA is the default branch's last commit — NOT the PR. Every job therefore
#     checks out `refs/pull/<n>/merge` explicitly, or it would review main instead of the PR.
#
# Ordering is by `needs:`, not by waiting on a label event: `review-audit` starts only once
# `review` has finished, deterministically, with no event round-trip to lose or re-fire.
# Labels are display only — Review ongoing -> Audit ongoing -> Review finished.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  # A new push supersedes an in-flight review, cancelling it. The same push then runs the
  # gate's `synchronize` branch, which clears every label — so a cancelled run cannot leave
  # a label claiming a review that no longer exists.
  group: agentic-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # ONLY a push may cancel. The reviewer posts its verdict as a PR comment as claude[bot] --
  # a GitHub App token, which DOES create a run (GITHUB_TOKEN would not) -- and that run lands
  # in this same group, so a bare `true` made the reviewer cancel the run that posted it, 1.5s
  # after it finished. Run 33352215846 died at 03:00:00.94 ("The operation was canceled")
  # having ALREADY set conclusion=success, so review-audit never started; 33352392606 was
  # queued 02:59:59 by claude[bot]. Keying the GROUP on event_name does NOT fix this -- both
  # runs are `issue_comment`, so they still collide, and a push would stop superseding.
  # An `issue_comment` run now queues instead; its gate returns run=false in ~5s.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write          # PR conversation comments are issue comments (labels + reactions)
  id-token: write
# `statuses: write` is deliberately NOT here. It is granted to `finalize` alone, at job level —
# see that job. Granting it workflow-wide would hand it to both agent jobs, and a reviewer able
# to post a commit status could mark its own review green.

env:
  # `gate` and `finalize` run without a checkout, so `gh` has no git remote to infer the
  # repo from and dies with "not a git repository" — which `|| true` then swallows, leaving
  # a green job that silently did nothing. Observed on run 32945248143. Set it for every job.
  GH_REPO: ${{ github.repository }}

jobs:
  gate:
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level set, so everything this job calls is
    # listed here. Like `finalize`, this job runs NO agent -- which is why it may hold
    # `statuses: write`. `id-token: write` is dropped: gate uses no OIDC. The three inherited
    # scopes are unchanged, and the eyes reaction is known to work under them (it landed on
    # comment 5473122653 at 02:56:18Z).
    permissions:
      contents: read
      pull-requests: write   # gh pr edit --remove-label (the synchronize branch)
      issues: write          # PR labels go through the issues API; also the eyes reaction
      statuses: write        # the pending statuses posted below
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr: ${{ steps.decide.outputs.pr }}
    steps:
      - id: decide
        # Every piece of event data arrives as an env var, never interpolated into the script.
        # A comment body is attacker-controlled text; `${{ }}` would splice it into the shell.
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request.url }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          CID: ${{ github.event.comment.id }}
          PR_EVT: ${{ github.event.pull_request.number }}
          ISSUE_NO: ${{ github.event.issue.number }}
          ASSOC: ${{ github.event.comment.author_association }}
          HAVE_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A push invalidates a completed review. Clear the labels so they cannot claim a
          # review that no longer matches the code — but do NOT re-run the agents; that is
          # what `/agentic-review` is for. This is the only reason `synchronize` is in the
          # trigger list: it creates a run, and this branch ends it cheaply. Placed before
          # the key check because label hygiene does not depend on the token.
          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "synchronize" ]; then
            gh pr edit "$PR_EVT" --remove-label "Review ongoing" \
              --remove-label "Audit ongoing" --remove-label "Review finished" || true
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Without the key the action cannot run. Stand down quietly rather than fail red on
          # every PR — this workflow is merged before the secret exists. `secrets` is not
          # available to a job-level `if:`, so the check has to live here in a step.
          if [ "$HAVE_KEY" != "true" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set — agentic review skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_EVT" >> "$GITHUB_OUTPUT"
          # `issue.pull_request` is present only when the comment is on a PR, per GitHub's
          # documented way to tell PR comments from issue comments.
          # The trailing class mirrors claude-code-action's own trigger regex
          # (src/github/validation/trigger.ts) so `/agentic-review, please` still fires.
          # Only a write-level author may trigger a run. claude-code-action rejects
          # non-write actors itself, but that happens AFTER this job has already reacted and
          # labelled — which would leave a red run and a stranded label on a public repo.
          elif [ -n "$IS_PR" ] \
               && printf '%s' "$ASSOC" | grep -qxE 'OWNER|MEMBER|COLLABORATOR' \
               && printf '%s' "$BODY" \
               | grep -qiE '(^|[[:space:]])/agentic-review([[:space:].,!?;:]|$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "pr=$ISSUE_NO" >> "$GITHUB_OUTPUT"
            # Acknowledge the trigger. Best-effort: never fail the run over an emoji.
            gh api -X POST "repos/$REPO/issues/comments/$CID/reactions" -f content=eyes \
              || echo "::warning::could not add the eye reaction (non-fatal)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # A push invalidates any earlier review: nobody has reviewed the new commit. The labels
      # are cleared above, but a label is not a check -- and statuses are per-SHA, so the new
      # SHA starts with NO `agentic-review` context and the PR reads "All checks have passed"
      # on code no agent has seen. Measured on PR #3: heads 7c9c1a0, 50f2be6 and 56546b5 each
      # carry zero statuses. `pending`, not `failure`: unreviewed is not broken. The SHA comes
      # from the event payload -- verified equal to the pushed tip on four runs -- so there is
      # no API call here that can fail.
      - name: Mark the new commit unreviewed
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
            -f state=pending -f context="agentic-review" \
            -f description="new commit — not reviewed; run /agentic-review" || true

      # `finalize` writes the terminal status only at the END, so for the whole 4-15 min a
      # review takes the PR again carried no context: on PR #3 the review ran 02:56:22-03:00:04
      # and the status was created 03:00:12.
      #
      # continue-on-error on both steps: a cosmetic status must NEVER be able to fail `gate`.
      # `review` is `if: needs.gate.outputs.run == 'true'`, which carries no status function, so
      # GitHub ANDs an implicit success() onto it -- without this, one failed `gh` call here
      # would SKIP the entire review.
      - name: Mark the review pending
        if: steps.decide.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.decide.outputs.pr }}
        run: |
          set -euo pipefail
          # The PR head SHA, not $GITHUB_SHA -- see the same note in `finalize`.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
            -f state=pending -f context="agentic-review" \
            -f description="review + audit running" || true

  review:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The ACTION's own verdict, which is NOT the same as the job's result. On a workflow-
      # validation skip claude-code-action returns at run.ts:182 — before run.ts:315 ever
      # sets this — so it is empty while the job still reports success. Observed live on
      # PR #5: both agent jobs green in ~20s, zero review posted.
      conclusion: ${{ steps.agent.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ needs.gate.outputs.pr }}/merge
          fetch-depth: 0
      - name: Label — review starting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two calls, not one. `gh pr edit --add-label X --remove-label Y` launches both
          # mutations as separate goroutines on one errgroup (cli/cli v2.98.0,
          # pkg/cmd/pr/shared/editable_http.go:12-36), so their order is undefined and the PR
          # can briefly carry BOTH labels. Removing first, in its own call, makes every
          # transition strictly one-way. Observed on PR #7: "Audit ongoing" LABELED and
          # "Review ongoing" UNLABELED both landed at 11:07:37Z.
          gh pr edit "${{ needs.gate.outputs.pr }}" --remove-label "Review finished" || true
          gh pr edit "${{ needs.gate.outputs.pr }}" --add-label "Review ongoing"     || true
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent mode (which `prompt:` selects) installs NO comment MCP server and grants
          # NO tools unless they are named here -- see install-mcp-server.ts:114 and
          # modes/agent/index.ts:16-18. Without this the agent is told to "post a comment"
          # while holding no tool that can post one, which is why PR #5's Conversation tab
          # stayed empty. Read/Write/Edit + a test runner are what verify.md:14,19-20
          # requires: run the tests, add a throwaway one, then delete it and revert.
          # Read-only. 0 of 6 reviewer grants across claude-cookbooks and kandev include Write
          # or Edit; kandev disallows them outright. This is scope hardening, NOT a turn-budget
          # fix -- run 33337470549 had 34 denials and ZERO of them were Write/Edit. It is safe
          # only because verify.md now tells a CI reviewer to read and report, not reproduce;
          # applied without that, the agent would attempt writes it no longer holds.
          # Deliberately NOT granted: `git push`, `gh pr merge/close`, `gh api`, `gh secret`,
          # network fetchers, and any shell that can run arbitrary scripts (`bash`, `sh`).
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            You are the `review` role. Follow, from this checkout:
              core/roles/review.md      — what to produce
              core/shared/verify.md     — how to ground each finding, and revert every throwaway
            REPO: ${{ github.repository }}   PR: ${{ needs.gate.outputs.pr }}

            Post exactly ONE pull request comment. For every finding give:
              * the file path and line number
              * before/after code
              * why it matters
            End the comment with a "Verification process" section stating which tests you ran,
            any throwaway test or temporary amendment you made and removed, and the final
            `git status --porcelain`. A finding you could not ground, mark as unverified.
      # The workflow log reports `permission_denials_count` but never WHICH calls were denied,
      # so a too-narrow --allowedTools can only be widened by guesswork. The action writes the
      # turn-by-turn transcript to ${runner.temp}/claude-execution-output.json; upload it so the
      # denied calls can be read off one run instead of inferred over several at ~$1 each.
      # `if: always()` because the interesting case is the failing run.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-review
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7

  review-audit:
    needs: [gate, review]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The ACTION's own verdict, which is NOT the same as the job's result. On a workflow-
      # validation skip claude-code-action returns at run.ts:182 — before run.ts:315 ever
      # sets this — so it is empty while the job still reports success. Observed live on
      # PR #5: both agent jobs green in ~20s, zero review posted.
      conclusion: ${{ steps.agent.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ needs.gate.outputs.pr }}/merge
          fetch-depth: 0
      - name: Label — audit starting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove before add -- see the note in the `review` job. This is the transition
          # that showed both labels at once.
          gh pr edit "${{ needs.gate.outputs.pr }}" --remove-label "Review ongoing" || true
          gh pr edit "${{ needs.gate.outputs.pr }}" --add-label "Audit ongoing"     || true
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent mode (which `prompt:` selects) installs NO comment MCP server and grants
          # NO tools unless they are named here -- see install-mcp-server.ts:114 and
          # modes/agent/index.ts:16-18. Without this the agent is told to "post a comment"
          # while holding no tool that can post one, which is why PR #5's Conversation tab
          # stayed empty. Read/Write/Edit + a test runner are what verify.md:14,19-20
          # requires: run the tests, add a throwaway one, then delete it and revert.
          # Read-only. 0 of 6 reviewer grants across claude-cookbooks and kandev include Write
          # or Edit; kandev disallows them outright. This is scope hardening, NOT a turn-budget
          # fix -- run 33337470549 had 34 denials and ZERO of them were Write/Edit. It is safe
          # only because verify.md now tells a CI reviewer to read and report, not reproduce;
          # applied without that, the agent would attempt writes it no longer holds.
          # Deliberately NOT granted: `git push`, `gh pr merge/close`, `gh api`, `gh secret`,
          # network fetchers, and any shell that can run arbitrary scripts (`bash`, `sh`).
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
          prompt: |
            You are the `review-audit` auditor. Follow, from this checkout:
              core/auditors/review-audit.md — the criteria, including the two passes
              core/shared/verify.md         — how to ground each objection
            REPO: ${{ github.repository }}   PR: ${{ needs.gate.outputs.pr }}

            Pass 1 is BLIND. Form your own findings from the diff BEFORE you read the
            reviewer's comment; reading it first anchors you, and blind spots are what this
            pass exists to catch. Only then open the review and compare.

            Then post a SECOND pull request comment of your own, below the reviewer's.
            Do NOT edit or delete theirs: the original review and your corrections must
            both stay visible, or there is no record of what the audit actually caught.
            Open with a one-line verdict, then:
              * if something is wrong, correct it and say what was wrong
              * if nothing is wrong, say so and explain why each finding holds
            End with a "Re-verification process" section: what you re-ran, what you
            amended and reverted, and the final `git status --porcelain`.
      # Same transcript upload as the review job -- see the comment there. The artifact name
      # must differ or the two jobs collide on upload.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-review-audit
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 7

  # A label must never outlive the run that set it. Proven necessary, not hypothetical:
  # on run 32675078939 the `review` job failed, so `review-audit` was skipped -- and a
  # skipped job runs ZERO steps, so its cleanup never ran and `Review ongoing` stranded
  # on the PR. `if: always()` on a step inside review-audit also mislabelled a FAILED
  # audit as `Review finished`. This job depends on all three, runs whatever happened,
  # and is the single owner of the terminal label.
  finalize:
    needs: [gate, review, review-audit]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level set, so everything this job calls must be
    # listed here. `statuses: write` is held by exactly two jobs -- this one and `gate` -- and
    # NEITHER of them runs an agent, whereas `review` and `review-audit` do. A reviewer that could post its own status could mark its own
    # review green — which is the failure this whole gate exists to prevent. Today the agent also
    # lacks a `gh api` tool, but that is the tool-list defending it, not the token scope; this
    # closes it at the scope so a future grant addition cannot silently reopen it. `gate` posts
    # only `pending`; this job remains the sole owner of the TERMINAL status.
    permissions:
      contents: read
      pull-requests: write   # gh pr edit --add-label / --remove-label
      issues: write          # PR labels go through the issues API
      statuses: write        # the commit status this job posts to the PR head SHA
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.gate.outputs.pr }}
          REVIEW: ${{ needs.review.result }}
          AUDIT: ${{ needs.review-audit.result }}
          REVIEW_CONC: ${{ needs.review.outputs.conclusion }}
          AUDIT_CONC: ${{ needs.review-audit.outputs.conclusion }}
        run: |
          set -euo pipefail
          # The PR head SHA, not $GITHUB_SHA: on an issue_comment run the latter is the DEFAULT
          # branch's tip, so a status posted to it would land on main and never on the PR.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          # A job can succeed without reviewing anything: claude-code-action exits 0
          # when it declines and returns before setting `conclusion`.
          if [ "$REVIEW" = "success" ] && [ "$AUDIT" = "success" ] \
             && [ "$REVIEW_CONC" = "success" ] && [ "$AUDIT_CONC" = "success" ]; then
            # Removes first, then the terminal add -- see the note in the `review` job.
            # Two removes in one call share a single mutation, so they cannot race.
            gh pr edit "$PR" --remove-label "Review ongoing" \
              --remove-label "Audit ongoing" || true
            gh pr edit "$PR" --add-label "Review finished" || true
            gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
              -f state=success -f context="agentic-review" \
              -f description="review + audit complete" || true
          else
            # Failed, cancelled or timed out: leave NO label rather than one claiming a
            # review that did not complete.
            echo "::warning::review=$REVIEW(conclusion=${REVIEW_CONC:-unset}) audit=$AUDIT(conclusion=${AUDIT_CONC:-unset}) — no review claimed; clearing labels."
            gh pr edit "$PR" --remove-label "Review ongoing" \
              --remove-label "Audit ongoing" --remove-label "Review finished" || true
            # The label alone is not enough: an issue_comment run's checks never reach the PR,
            # so without this the PR still reads "All checks have passed" after a failed review.
            # The description carries the CONCLUSIONS, not just the job results. Without them
            # it read "no review claimed (review=success audit=success)" -- self-contradictory
            # on the PR, because the real reason (claude-code-action skipped, so it never set
            # `conclusion`) lived only in the run log. Seen on PR #7 run 33385459214.
            # NB: no comments inside the `\`-continued command below -- a comment there ends
            # the command and silently drops every flag after it.
            gh api -X POST "repos/$GH_REPO/statuses/$SHA" \
              -f state=failure -f context="agentic-review" \
              -f description="no review claimed (review=$REVIEW/${REVIEW_CONC:-unset} audit=$AUDIT/${AUDIT_CONC:-unset})" || true
          fi
