name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts parse
        # Catches syntax errors in the hooks. A hook that fails to parse exits
        # non-zero at load time, which for gate-check/ship-gate means the gate
        # silently fails OPEN — so this is a real safety check, not lint.
        run: |
          for f in $(git ls-files '*.sh') adapters/claude-code/bin/unblock; do
            bash -n "$f"
          done

      - name: settings.json is valid JSON
        # A malformed settings.json means Claude Code loads no hooks at all.
        run: python3 -c "import json; json.load(open('adapters/claude-code/.claude/settings.json'))"

      - name: ship-gate self-test
        # 14 cases: ask / block / pass. The gate fails OPEN if its file is
        # missing or broken, so this self-test is how we know it is live.
        run: bash adapters/claude-code/.claude/hooks/ship-gate.selftest.sh

      - name: grilling-gate self-test
        # 18 cases: pass / ask / block, four gate-clear scenarios, and two that
        # pin the gate-file parse. Same reason as above — a missing or broken
        # hook exits 127, which does not block, so this gate fails OPEN too.
        run: bash adapters/claude-code/.claude/hooks/gate-check.selftest.sh

      - name: audit-gate self-test
        # 19 cases: the .gate parse both hooks share, a subagent's own report
        # never acting as control, where the suppression branch sits, and a
        # fourth set driving inputs the others never reach (a non-build role,
        # its auditor, a two-entry ledger, an absent .gate, a nested
        # agent_type) that asserts the ledger's contents, so a wrong NAME
        # cannot hide behind a plausible count. Most of these skip the audit
        # loop silently; one jams a discharged debt in the ledger — so it
        # needs its own proof that it still trips.
        run: bash adapters/claude-code/.claude/hooks/audit-gate.selftest.sh
